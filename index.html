<script>

// ★ GAME_CONFIG
const GAME_CONFIG={
  callSec:120,       // 전화 오는 간격(초)
  firstCall:45,      // 첫 전화 시각(초)
  crashSec:600,      // 10분 뒤 폰에 이상현상(화면 깨짐 + 모두에게 상호작용 불가)

  rules:{polite:15,repeat:5,slow:3,leader:-5}
};
const POLITE=/(습니다|세요|해요|예요|이에요|죄송|감사|부탁|입니다|니까)/;
const EMOTI=/(ㅋㅋ|ㅎㅎ|\^\^|ㅠㅠ|ㅜㅜ|😀|😂|😊)/;

// ★ 키워드 묶음: '|' 로 비슷한 말을 한꺼번에 인식, 앞에 '=' 를 붙이면 그 말만 정확히 일치. 직접 "키워드":"답장" 으로 써도 됩니다.
const A={
 denial:"교주아니|교주가아니|교주아님|교주아닌|교주아닙|난교주|내가교주아|교주없|진짜교주아",
 who:"누구|누군|정체", what:"뭐야|뭔데|뭐임|뭐라고|무슨소리", yo:"=야|=야야|=이봐|=저기|=여보|=거기",
 hello:"안녕|하이|ㅎㅇ|반가", police:"경찰|형사|수사|신고|112|체포|고소", secret:"비밀|숨기|감추|몰래",
 rally:"집회|모임|예배|기도회|행사|본당", money:"돈|헌금|입금|송금|계좌|통장|대출", where:"어디|위치|어딨",

};

// ★ BOND: 연락을 이어갈수록(메시지를 주고받을수록) 호감도가 쌓여 개인 사정을 털어놓고 말투가 따뜻해짐. story=3번 대화마다 하나씩 순서대로, warm=호감도가 쌓인 뒤 일반 답장
const BOND={
 dohyun:{story:["교주님, 사실 저도 요즘 잠을 못 잡니다. 집에 혼자 계신 어머니가 걸려서요.","어머니가 혼자 지내십니다. 제가 이런 곳에 있는 걸 모르십니다.","...어릴 때부터 정의라는 말을 믿었습니다. 지금은 잘 모르겠습니다.","교주님과 이렇게 대화하다 보면 이상하게 사람 사는 이야기를 하게 됩니다.","무사히 끝나면, 어머니 밥상에 모시고 싶습니다. 거창한 건 없지만요."],
  warm:["교주님과 얘기하면 마음이 놓입니다.","오늘은 제 얘기가 길어졌습니다. 죄송합니다.","제 속내를 이렇게 말해 본 건 오랜만입니다.","교주님도 무리하지 마십시오.","언제든 전화 주십시오. 기다리겠습니다."]},

function draw(){const t=$('#ti'),keep=t?t.value:'';if(S.v.app==='th'&&S.th[S.v.k])S.th[S.v.k].un=0;
 $('#scr').innerHTML=V[S.v.app]();sbar();

/* 문자 */
const norm=s=>s.toLowerCase().replace(/[\s.,!?~…ㅡ\-]/g,'');
const hit=(q,key)=>key.split('|').some(a=>{a=norm(a);return a[0]==='='?q===a.slice(1):a&&q.includes(a)});
const nv=v=>typeof v==='string'?{seq:[v],s:0}:Array.isArray(v)?(typeof v[1]==='number'?{seq:[v[0]],s:v[1]}:{seq:v,s:0}):{seq:[v.reply].concat(v.then||[]),s:v.suspicion||v.s||0};

function send(){const i=$('#ti'),k=S.v.k,c=CHARACTERS[k]||{keywords:{},defaultReplies:["누구세요?"]},x=i.value.trim();if(!x||!S.on||c.ro||c.off)return;i.value='';
 const t=S.th[k];
 if(S.dead){t.m.push({f:1,t:'(답장하지 않는다)',a:fmt(S.min)});t.ord=++S.seq;draw();return}
 t.m.push({f:1,t:x,a:fmt(S.min)});t.ord=++S.seq;
 const R=GAME_CONFIG.rules;let s=0;
 if(POLITE.test(x)||EMOTI.test(x))s+=c.strict?R.polite+10:R.polite;
 if(LEADER.test(x))s+=c.strict?R.leader*2:R.leader;
 if(x===S.lastTxt)s+=R.repeat;S.lastTxt=x;
 if(S.lastIn[k]&&Date.now()-S.lastIn[k]>20000)s+=R.slow;S.lastIn[k]=0;
 const agg=S.susp>=GAME_CONFIG.aggressiveAt,q=norm(x),U=S.used[k]=S.used[k]||new Set(),b=c.bond;let r=null,st=null,a=0;
 if(b&&!agg){a=S.aff[k]=(S.aff[k]||0)+1;const n=S.sti[k]||0;if(a%3===0&&n<b.story.length){S.sti[k]=n+1;st=b.story[n]}}
 for(const w in c.keywords||{})if(hit(q,w)){const v=nv(c.keywords[w]),n=S.kc[k+w]||0;if(n<v.seq.length){r=v.seq[n];S.kc[k+w]=n+1;s+=v.s}break}
 if(r===null||(agg&&c.aggressive&&Math.random()<.5)){const base=agg&&c.aggressive?c.aggressive.concat(c.defaultReplies):(b&&a>=3?b.warm.concat(c.defaultReplies.slice(0,2)):c.defaultReplies);let f=base.filter(z=>!U.has(z));if(!f.length){U.clear();f=base.filter(z=>z!==S.lastR[k])}r=pick(f)}
